name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.base_ref || 'none' }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test & Coverage
        run: npm run test:coverage

      - name: Next.js Production Build
        run: npm run build

      - name: Next.js Supabase Build
        env:
          NEXT_PUBLIC_DATA_MODE: supabase
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Security Audit
        run: npm run audit

      - name: Git Diff Whitespace Check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..HEAD"
          fi

  supabase-ci:
    name: Supabase Staging Database & Schema Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'iwesoczokkycjovyknnz' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_DATA_MODE: supabase

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Supabase Credentials
        run: |
          if [ "$SUPABASE_PROJECT_REF" != "iwesoczokkycjovyknnz" ] || [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://iwesoczokkycjovyknnz.supabase.co" ]; then
            echo "::error::Cloud tests are restricted to fincontrol-staging."
            exit 1
          fi
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Supabase Cloud verification."
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Link Supabase Project
        run: |
          node scripts/check-cloud-target.mjs --before-link
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          node scripts/check-cloud-target.mjs

      - name: Verify Migration Parity
        run: |
          npx supabase migration list --output-format json | node -e '
            const result = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const migrations = result.migrations;
            if (!Array.isArray(migrations) || migrations.length === 0 ||
                migrations.some((migration) => !migration.local || !migration.remote || migration.local !== migration.remote)) {
              console.error("Local and Supabase Cloud migration histories differ.");
              process.exit(1);
            }
            console.log(`${migrations.length} migrations match Supabase Cloud.`);
          '

      - name: Database Schema Lint
        run: npx supabase db lint --linked --schema public --level error --fail-on error

      - name: Cloud Database pgTAP Tests
        # GitHub-hosted runners are IPv4-only; the runner's CLI-linked mode avoids
        # connecting directly to the Supabase database's IPv6 endpoint.
        env:
          SUPABASE_DB_PASSWORD: ''
        run: npm run test:db:cloud

      - name: Verify Type Drift
        run: |
          npx supabase gen types typescript --linked --schema public > src/lib/supabase/database.types.ts
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Cloud Integration Tests (Repository & Provider)
        run: npm run test:repo:cloud

      - name: Cloud Auth Tests (No SMTP)
        run: npm run test:auth:cloud
